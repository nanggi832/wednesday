<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,1.0)  0%,
      rgba(0,0,0,0.75) 25%,
      rgba(0,0,0,0.2)  50%,
      rgba(0,0,0,0.0)  65%
    ),
    linear-gradient(
      to top,
      rgba(0,0,0,1.0)  0%,
      rgba(0,0,0,0.85) 20%,
      rgba(0,0,0,0.3)  45%,
      rgba(0,0,0,0.0)  65%
    ),
    linear-gradient(
      to left,
      rgba(0,0,0,0.65) 0%,
      rgba(0,0,0,0.3)  25%,
      rgba(0,0,0,0.0)  55%
    );
    z-index: 10;
  }

  #text-overlay {
    position: fixed;
    left: 11%;
    top: 36%;
    transform: translateY(-50%);
    z-index: 20;
    pointer-events: none;
    max-width: 78%;
  }
  #text-overlay h1 {
    font-family: 'Hellix', 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 4.5vw, 58px);
    color: #ffffff;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  #text-overlay p {
    font-family: 'Hellix', 'Outfit', sans-serif;
    font-weight: 400;
    font-size: clamp(11px, 1.4vw, 18px);
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  /* 모바일 세로 */
  @media (max-width: 768px) {
    #text-overlay {
      left: 6%;
      top: 30%;
      max-width: 88%;
    }
    #text-overlay h1 {
      font-size: clamp(22px, 6.5vw, 36px);
    }
    #text-overlay p {
      font-size: clamp(11px, 3.2vw, 15px);
    }
  }
</style>
</head>
<body>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=hellix@400,700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<div id="vignette"></div>
<div id="text-overlay">
  <h1>Gurufin National Trust Bank</h1>
  <p>Enterprise settlement. Documented standards. Reliable redemption.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

// 카메라 고정: 더 비틀고 앞으로
const DIST = 26;
const CAM_ANGLE = (Math.PI / 180) * -32;
camera.position.set(
  Math.sin(CAM_ANGLE) * DIST,
  6,
  Math.cos(CAM_ANGLE) * DIST
);
camera.lookAt(0, -4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ── Lights ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x040404, 1));

// 백라이트 1 — 메인, 뒤 위에서 강하게
const backLight = new THREE.DirectionalLight(0xaabbcc, 1.8);
backLight.position.set(0, 12, -20);
scene.add(backLight);

// 백라이트 2 — 은은하게, 반대 사이드에서
const backLight2 = new THREE.DirectionalLight(0x667788, 0.4);
backLight2.position.set(-12, 6, -18);
scene.add(backLight2);

// 림라이트 — 옆 뒤에서 얇게 테두리
const rimLight = new THREE.DirectionalLight(0x8899aa, 0.9);
rimLight.position.set(10, 6, -15);
scene.add(rimLight);

// ── Grid ───────────────────────────────────────────────
const COLS    = 300;
const ROWS    = 140;
const SPACING = 0.32;

const geometry = new THREE.SphereGeometry(0.12, 7, 7);
const material = new THREE.MeshPhongMaterial({
  color: 0x888888,
  specular: 0xffffff,
  shininess: 220,
});

const mesh = new THREE.InstancedMesh(geometry, material, COLS * ROWS);
scene.add(mesh);

const positions = [];
const dummy = new THREE.Object3D();
let idx = 0;

// 우측으로 더 많이, 뒤쪽 오프셋
const X_OFFSET = 60 * SPACING;
const Z_OFFSET = 25 * SPACING;

for (let row = 0; row < ROWS; row++) {
  const zigzag = (row % 2 === 0) ? SPACING * 0.5 : 0;
  for (let col = 0; col < COLS; col++) {
    const x = (col - COLS / 2) * SPACING + X_OFFSET + zigzag;
    const z = (row - ROWS / 2) * SPACING - Z_OFFSET;
    // 공마다 랜덤 위상 오프셋 + 랜덤 크기
    const phase = Math.random() * Math.PI * 0.25;
    const scale = 0.9625 + Math.random() * 0.075;
    const rx = (Math.random() - 0.5) * SPACING * 0.15;
    const rz = (Math.random() - 0.5) * SPACING * 0.15;
    positions.push({ x: x + rx, z: z + rz, phase, scale });
    dummy.position.set(x + rx, 0, z + rz);
    dummy.scale.setScalar(scale);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx++, dummy.matrix);
  }
}
mesh.instanceMatrix.needsUpdate = true;

// ── Colors ─────────────────────────────────────────────
const colorDark   = new THREE.Color(0x050505);
const colorMid    = new THREE.Color(0x3a4455);
const colorBright = new THREE.Color(0xe8e8e8);
const maxZ = (ROWS / 2) * SPACING + Z_OFFSET;

// ── Seamless Loop 설정 ────────────────────────────────
// LOOP = 10초. 모든 wave speed = 2π/LOOP 의 정수배
// → t=LOOP 에서 모든 파형이 정확히 원점으로 복귀 = 완벽한 loop
const LOOP = 10;
const W = (2 * Math.PI) / LOOP; // 기본 각속도

// speed1 = 2W, speed2 = 1W, speed3 = 3W
function getWaveY(x, z, t) {
  return Math.sin(x * 0.30 + t * (2 * W)) * 1.25
       + Math.cos(z * 0.18 + t * (1 * W)) * 0.75
       + Math.sin((x * 0.4 + z * 0.25) * 0.38 + t * (3 * W)) * 0.4;
}

// ── Mobile detection ───────────────────────────────────
const isMobile = window.innerWidth < 768;

// ── Mouse / Touch Parallax ─────────────────────────────
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;
const MAX_DEG = 1.5;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// 터치 패럴랙스
window.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  mouseX = (touch.clientX / window.innerWidth  - 0.5) * 2;
  mouseY = (touch.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

// ── Animate ────────────────────────────────────────────
const clock = new THREE.Clock();
const BASE_ANGLE = (Math.PI / 180) * -32;
const BASE_Y = 6;

// 모바일은 FOV 넓게, lookAt 조정
if (isMobile) {
  camera.fov = 75;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);

  // t를 LOOP 주기로 모듈로 → 완벽한 seamless loop
  const elapsed = clock.getElapsedTime();
  const t = elapsed % LOOP;

  // 마우스 부드럽게 따라가기 (lerp)
  targetX += (mouseX - targetX) * 0.02;
  targetY += (mouseY - targetY) * 0.02;

  const angleOffset = targetX * (Math.PI / 180) * MAX_DEG;
  const yOffset     = targetY * MAX_DEG * 0.3;
  const a = BASE_ANGLE + angleOffset;
  camera.position.set(
    Math.sin(a) * DIST,
    BASE_Y - yOffset,
    Math.cos(a) * DIST
  );
  camera.lookAt(0, -4, 0);

  let i = 0;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const { x, z, phase, scale } = positions[i];
      const y = getWaveY(x, z, t) + Math.sin(t * (2 * W) + phase) * 0.01875;

      dummy.position.set(x, y, z);
      dummy.scale.setScalar(scale);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);

      const heightN = Math.max(0, Math.min(1, (y + 2.25) / 4.5));
      // 뒤쪽 더 급격히 암전, 세제곱 감쇠
      const zFade   = Math.max(0, Math.min(1, (z + maxZ * 0.05) / (maxZ * 0.4)));
      const b = heightN * (zFade * zFade * zFade);

      const c = b < 0.5
        ? colorDark.clone().lerp(colorMid,    b * 2)
        : colorMid.clone().lerp(colorBright, (b - 0.5) * 2);
      mesh.setColorAt(i, c);
      i++;
    }
  }

  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

// resize
const BASE_WIDTH  = window.innerWidth;
const BASE_HEIGHT = window.innerHeight;
const BASE_ASPECT = BASE_WIDTH / BASE_HEIGHT;

camera.aspect = BASE_ASPECT;
camera.updateProjectionMatrix();

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);

  const mobile = w < 768;
  camera.fov = mobile ? 75 : 60;

  if (mobile) {
    // 모바일: 그냥 aspect 맞춤 (crop 없이 전체 보여줌)
    camera.clearViewOffset();
    camera.aspect = w / h;
  } else {
    // 데스크탑: 왼쪽 기준 anchor
    const fullW = h * BASE_ASPECT;
    camera.setViewOffset(Math.round(fullW), h, 0, 0, w, h);
    camera.aspect = w / h;
  }
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
